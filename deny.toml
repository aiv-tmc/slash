[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

# Same audited-ignore set as .cargo/audit.toml (see the comment there);
# drop entries as the libp2p >= 0.56 upgrade lands.
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0551",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0491",
    "RUSTSEC-2026-0550",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
    "RUSTSEC-2026-0536",
    "RUSTSEC-2026-0534",
    "RUSTSEC-2026-0535",
    "RUSTSEC-2026-0537",
    "RUSTSEC-2026-0525",
    "RUSTSEC-2025-0009",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
