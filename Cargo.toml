[package]
name = "slash"
version = "0.7.0"
edition = "2021"
# Minimum supported Rust version. The codebase relies on integer
# `is_multiple_of` (1.87) and `Option::is_none_or` (1.82).
rust-version = "1.87"
autobenches = false
autotests = true

[features]
# Exposes the shared test fixtures as public library API. Test crates and
# benchmarks build the library with this feature (through the
# self-referential dev-dependency below), so the fixtures live in exactly
# one place and public items carry no dead-code lint in any consumer.
test-utils = []

[dependencies]
async-trait = "0.1"
axum = "0.7"
bincode = "1.3"
blake3 = "1.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = "4.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
# The "cbor" feature stays removed: the request-response codec serializes
# with length-prefixed bincode through a custom Codec implementation in
# src/p2p.rs, so the CBOR machinery would be an unused dependency surface.
# The "kad" feature is required because the peer discovery behaviour in
# src/p2p.rs instantiates a Kademlia DHT for address propagation.
# The "macros" feature is required: it re-exports the `NetworkBehaviour`
# derive macro that generates the `BehaviourEvent` enum and the trait
# implementation for the composite behaviour struct in src/p2p.rs.
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "identify", "request-response", "kad", "macros"] }
rand = "0.8"
rpassword = "7.3"
rust-randomx = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.7", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
anyhow = "1.0"

# RandomX is a pure compute library: its C core gains nothing from a
# debug build, and at -O0 every context initialization costs seconds,
# which pushes every debug-profile test that mines or verifies a block
# past any reasonable time budget. The crate builds its C core through
# its own build script, so pinning the crate to full optimization in the
# dev profile pins the library too.
[profile.dev.package.rust-randomx]
opt-level = 3

# Thin LTO across the crate graph plus a single codegen unit recovers
# 10-25% on the hashing and serialization hot paths (sighash, page
# roots, block body hash) at the cost of a longer release link. Panic
# stays unwind: the FFI boundary and the recovery journal catch panics
# per call, so "abort" would change observable behavior.
[profile.release]
lto = "thin"
codegen-units = 1

# Benchmark-only crates stay out of the release dependency graph so that
# production builds do not compile the Criterion harness.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Self-referential dev-dependency with the test-utils feature. It unifies
# the feature across the build graph for every test and bench target, so
# `slash::test_fixtures` resolves in integration tests and benches without
# passing command-line feature flags.
slash = { path = ".", features = ["test-utils"] }

# Test crates living in subdirectories are not auto-discovered: each one
# needs an explicit target pointing at its entry file. Keep this list in
# sync when adding a tests/<name>/main.rs crate.
[[test]]
name = "chain_tests"
path = "tests/chain_tests/main.rs"

[[test]]
name = "dao_tests"
path = "tests/dao_tests/main.rs"

[[test]]
name = "dev_fee_tests"
path = "tests/dev_fee_tests/main.rs"

[[test]]
name = "emission_harness_tests"
path = "tests/emission_harness_tests/main.rs"

[[test]]
name = "era_nine_boundary_tests"
path = "tests/era_nine_boundary_tests/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests/main.rs"

[[test]]
name = "p2p_tests"
path = "tests/p2p_tests/main.rs"

[[test]]
name = "reorg_persistence_tests"
path = "tests/reorg_persistence_tests/main.rs"

[[test]]
name = "slow_chain_tests"
path = "tests/slow_chain_tests/main.rs"

[[test]]
name = "soak_invariants_tests"
path = "tests/soak_invariants_tests/main.rs"

[[test]]
name = "soak_network_tests"
path = "tests/soak_network_tests/main.rs"

[[test]]
name = "treasury_tests"
path = "tests/treasury_tests/main.rs"

[[test]]
name = "wire_format_tests"
path = "tests/wire_format_tests/main.rs"

# The Criterion harness requires a single entry point. The measurements
# live in the benches/ modules so every file stays readable;
# the runner itself only wires the groups together.
[[bench]]
name = "benchmarks"
harness = false
path = "benches/main.rs"
