version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      crypto:
        patterns:
          - "ed25519-dalek"
          - "x25519-dalek"
          - "curve25519-dalek"
          - "aes-gcm"
          - "argon2"
          - "blake3"
          - "sha2"
          - "zeroize"
      p2p:
        patterns:
          - "libp2p"
          - "futures"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
