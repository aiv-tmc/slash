name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-clippy
      - name: System dependencies (RandomX / libp2p)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-doc
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  lockfile:
    name: Cargo.lock committed & fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Lockfile exists
        run: test -f Cargo.lock
      - name: Lockfile is fresh
        run: |
          cargo update --locked --dry-run 2>/dev/null || \
            (echo "Cargo.lock is out of date; run 'cargo update' and commit" && exit 1)

  unit:
    name: unit tests (lib + bins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-test
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - run: cargo test --lib --bins --locked

  doc-tests:
    name: doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-test
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - run: cargo test --doc --locked

  integration:
    name: integration / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [clippy, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: chain_tests,              threads: 4, timeout: 40 }
          - { target: dao_tests,                threads: 4, timeout: 40 }
          - { target: dev_fee_tests,            threads: 4, timeout: 30 }
          - { target: emission_harness_tests, threads: 4, timeout: 40 }
          - { target: era_nine_boundary_tests,  threads: 4, timeout: 30 }
          - { target: integration_tests,        threads: 4, timeout: 40 }
          - { target: p2p_tests,                threads: 4, timeout: 40 }
          - { target: reorg_persistence_tests, threads: 4, timeout: 40 }
          - { target: treasury_tests,         threads: 4, timeout: 40 }
          - { target: wire_format_tests,        threads: 4, timeout: 30 }
          - { target: slow_chain_tests,         threads: 2, timeout: 90 }
          - { target: soak_invariants_tests,    threads: 2, timeout: 120 }
          - { target: soak_network_tests,       threads: 2, timeout: 120 }
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-test
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - name: Run ${{ matrix.target }}
        run: cargo test --locked --test ${{ matrix.target }} -- --test-threads=${{ matrix.threads }}
        env:
          SLASH_TRACE_TX: 0

  bench-compile:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-bench
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - run: cargo bench --no-run --locked

  coverage:
    name: coverage (lib)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-cov
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --lib --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  supply-chain:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slash-audit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny chec
