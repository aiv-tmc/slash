name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "src/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "src/**"]

jobs:
  docs-consistency:
    name: documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden drift markers in committed code
        run: |
          # CONTRIBUTING.md forbids NEW/CHANGE/OLD/FIXME/HACK/TEMP in comments
          ! grep -rEn '// *(NEW|CHANGE|OLD|FIXME|HACK|TEMP)[: ]' src/ tests/ benches/
      - name: TEST.md mentions every integration target
        run: |
          for t in chain_tests dao_tests dev_fee_tests emission_harness_tests \
                   era_nine_boundary_tests integration_tests p2p_tests \
                   reorg_persistence_tests slow_chain_tests soak_invariants_tests \
                   soak_network_tests treasury_tests wire_format_tests; do
            grep -q "$t" TEST.md || { echo "TEST.md missing row for $t"; exit 1; }
            test -f "tests/$t/main.rs" || { echo "tests/$t/main.rs missing"; exit 1; }
          done
      - name: Cargo.toml test targets match tests/ layout
        run: |
          for t in chain_tests dao_tests dev_fee_tests emission_harness_tests \
                   era_nine_boundary_tests integration_tests p2p_tests \
                   reorg_persistence_tests slow_chain_tests soak_invariants_tests \
                   soak_network_tests treasury_tests wire_format_tests; do
            grep -q "tests/$t/main.rs" Cargo.toml || { echo "Cargo.toml missing [[test]] for $t"; exit 1; }
          done
