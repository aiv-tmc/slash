[advisories]

# Audited 2026-11-17 for the 0.8.0 beta: every finding sits in a transitive
# dependency pinned by libp2p 0.54 (h2/hickory via libp2p-dns and libp2p-upnp,
# gossipsub 0.47, QUIC/TLS via rcgen + rustls-webpki, ring 0.16). The
# affected transports (QUIC, TLS, UPnP, DNS resolution) are not enabled at
# runtime, and the gossipsub mesh runs only on the private testnet. The fix
# is a libp2p upgrade (>= 0.56) tracked for the next beta; re-run
# `cargo audit` after the upgrade and drop the resolved entries.
